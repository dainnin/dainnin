const mapeo = new function () {
  const _this = this;
  this.map = [];
  this.obstacles = [];
  const data = {
    tileSize: 48,
    mapWidth: 50,
    mapHeight: 30,
  }
  Object.defineProperties(this, {
    _map: {
      get: function () {
        return data
      },
      set: function (config) {
        Object.assign(data, config)

      }
    },
    tileSize: { get: function () { return data.tileSize } },
    mapWidth: { get: function () { return data.mapWidth } },
    mapHeight: { get: function () { return data.mapHeight } },

  })
  for (let y = 0; y < data.mapHeight; y++) {
    const row = [];
    for (let x = 0; x < data.mapWidth; x++) {
      const isBorder = x === 0 || y === 0 || x === data.mapWidth - 1 || y === data.mapHeight - 1;
      const type = isBorder ? "wall" : Math.random() < 0.1 ? "rock" :
        Math.random() < 0.1 ? "water" : "grass";
      const solid = isBorder || type === "rock";
      row.push({ type, solid });
    }
    _this.map.push(row);
  }




  function actualizarObstaculosDesdeMapa() {
    _this.obstacles.length = 0;
    for (let y = 0; y < data.mapHeight; y++) {
      for (let x = 0; x < data.mapWidth; x++) {
        const tile = _this.map[y][x];
        if (tile.solid) {
          _this.obstacles.push({
            x: x * data.tileSize,
            y: y * data.tileSize,
            w: data.tileSize,
            h: data.tileSize,
            solid: true
          });
        }
      }
    }
  }
  actualizarObstaculosDesdeMapa();

  this.isSolidTile = function (x, y) {
    const tileX = Math.floor(x / data.tileSize);
    const tileY = Math.floor(y / data.tileSize);
    return _this.map[tileY]?.[tileX]?.solid === true;
  }

  this.isInsideMap = function (x, y) {
    return (
      x >= 0 &&
      y >= 0 &&
      x < data.mapWidth * data.tileSize &&
      y < data.mapHeight * data.tileSize
    );
  }
  this.isValidNpcPosition=function(x, y) {
    const tileX = Math.floor(x / mapeo.tileSize);
    const tileY = Math.floor(y / mapeo.tileSize);
    const tile = mapeo.map[tileY]?.[tileX];
    if (!tile || tile.solid) return false;

    const neighbors = [
        mapeo.map[tileY - 1]?.[tileX],
        mapeo.map[tileY + 1]?.[tileX],
        mapeo.map[tileY]?.[tileX - 1],
        mapeo.map[tileY]?.[tileX + 1]
    ];
    return neighbors.some(n => n && !n.solid);
}
}


function isValidNpcPosition(x,y){}
function isSolidTile(x, y) {
  return mapeo.isSolidTile(x, y)
}

function isInsideMap(x, y) {

function drawMap(ctx, camera, tileStyles = {}) {

  const startX = Math.floor(camera.x / mapeo.tileSize);
  const startY = Math.floor(camera.y / mapeo.tileSize);
  const endX = startX + Math.ceil(camera.w / mapeo.tileSize);
  const endY = startY + Math.ceil(camera.h / mapeo.tileSize);
  function _bucle(x, y) {
    return [x * mapeo.tileSize - camera.x, y * mapeo.tileSize - camera.y, mapeo.tileSize, mapeo.tileSize];
  }
  for (let y = startY; y < endY; y++) {

    for (let x = startX; x < endX; x++) {
      const tile = mapeo.map[y]?.[x];
      if (!tile) continue;

      const style = tileStyles[tile.type];
      
      if (style?.color) {
        ctx.fillStyle = style.color;
        ctx.fillRect(..._bucle(x, y));
      }

      if (style?.image) {
        ctx.drawImage(style.image, ..._bucle(x, y));
      }
      if (tile.solid) {
        ctx.strokeStyle = "#ff00004d";
        ctx.strokeRect(..._bucle(x, y));
      }
    }
  }
}

function seleccionarObjetivo(npcs, player) {
  const enRango = npcs.filter(npc => {
    const dx = npc.x - player.x;
    const dy = npc.y - player.y;
    const dist = Math.hypot(dx, dy);
    return dist < player.rangoVision && npc.vida > 0;
  });

  enRango.sort((a, b) => {
    const da = Math.hypot(a.x - player.x, a.y - player.y);
    const db = Math.hypot(b.x - player.x, b.y - player.y);
    return da - db;
  });

  return enRango[0] || null;
}

function respawnPlayer() {
  for (let y = 1; y < mapeo.mapHeight - 1; y++) {
    for (let x = 1; x < mapeo.mapWidth - 1; x++) {
      const tile = mapeo.map[y]?.[x];
      if (tile && !tile.solid) {
        player.x = x * mapeo.tileSize;
        player.y = y * mapeo.tileSize;
        player.vida = player.vidaMax;
        player.objetivo = null;
        player.estado = "respawn";
        return;
      }
    }
  }
}

function updatePlayer(keys, npcs) {
  const ahora = Date.now();

  if (player.vida <= 0) {
    if (ahora - player.ultimoAtaque > 2000) {
      respawnPlayer();
    }
    return;
  }

  let dx = 0, dy = 0;

  if (keys["ArrowUp"] || keys["w"]) dy -= player.speed;
  if (keys["ArrowDown"] || keys["s"]) dy += player.speed;
  if (keys["ArrowLeft"] || keys["a"]) dx -= player.speed;
  if (keys["ArrowRight"] || keys["d"]) dx += player.speed;

  if (keys["t"]) {
    player.objetivo = player.objetivo ? null : seleccionarObjetivo(npcs, player);
  }

  const nextX = player.x + dx;
  const nextY = player.y + dy;

  const futureX = { ...player, x: nextX };
  const futureY = { ...player, y: nextY };

  const colisionX = mapeo.obstacles.some(obs => isColliding(futureX, obs));
  const colisionY = mapeo.obstacles.some(obs => isColliding(futureY, obs));

  if (keys[" "] && ahora - player.ultimoAtaque > player.cooldownAtaque) {
    if (player.objetivo && player.objetivo.vida > 0) {
      const dx = player.objetivo.x - player.x;
      const dy = player.objetivo.y - player.y;
      const dist = Math.hypot(dx, dy);

      if (dist < player.rangoAtaque) {
        player.objetivo.vida = Math.max(0, player.objetivo.vida - player.daño);
        player.ultimoAtaque = ahora;
      }
    }
  }

  if (isInsideMap(nextX, player.y) && !colisionX) {
    player.x = nextX;
  }
  if (isInsideMap(player.x, nextY) && !colisionY) {
    player.y = nextY;
  }

  for (const npc of npcs) {
    if (npc.solid && isColliding(player, npc)) {
      if (player.canalizando) {
        player.canalizando = false;
        player.estado = "interrumpido";
        player.hechizoActivo = null;
      }
    }
  }

  if (
    player.objetivo &&
    (player.objetivo.vida <= 0 ||
      Math.hypot(player.objetivo.x - player.x, player.objetivo.y - player.y) > player.rangoVision)
  ) {
    player.objetivo = null;
  }
}

function drawPlayer(ctx, camera) {
  if (player.name === "Sin nombre" || player.vida <= 0) return;

  const tileX = Math.floor(player.x / mapeo.tileSize);
  const tileY = Math.floor(player.y / mapeo.tileSize);
  const tile = mapeo.map[tileY]?.[tileX];

  if (tile?.solid) {
    for (let y = tileY - 1; y <= tileY + 1; y++) {
      for (let x = tileX - 1; x <= tileX + 1; x++) {
        const t = mapeo.map[y]?.[x];
        if (t && !t.solid) {
          player.x = x * mapeo.tileSize;
          player.y = y * mapeo.tileSize;
          break;
        }
      }
    }
  }

  if (player.image) {
    ctx.drawImage(
      player.image,
      player.x - camera.x,
      player.y - camera.y,
      player.w,
      player.h
    );
  } else if (player.color) {
    ctx.fillStyle = player.color;
    ctx.fillRect(
      player.x - camera.x,
      player.y - camera.y,
      player.w,
      player.h
    );
  }

  const vidaRatio = Math.max(player.vida / player.vidaMax, 0);
  ctx.fillStyle = "red";

  );
}

function updateNpcs(npcs, player) {
    for (const npc of npcs) {
       
        if (npc.vida > 0 && npc.hostil) {
            const dx = player.x - npc.x;
            const dy = player.y - npc.y;
            const dist = Math.hypot(dx, dy);

            if (dist < npc.rangoVision) {
                const dirX = dx / dist;
                const dirY = dy / dist;

                if (dist < npc.rangoAtaque) {
                    npc.estado = "atacando";

                    const ahora = Date.now();

                    if (ahora - npc.ultimoAtaque > npc.cooldownAtaque) {
                        player.vida = Math.max(0, player.vida - npc.daño);
                        npc.ultimoAtaque = ahora;

                    }

                } else {
                    npc.estado = "persiguiendo";

                    const nextX = npc.x + dirX * npc.velocidad;
                    const nextY = npc.y + dirY * npc.velocidad;

                    if (!mapeo.obstacles.some(obs => isColliding({ ...npc, x: nextX }, obs))) npc.x = nextX;
                    if (!mapeo.obstacles.some(obs => isColliding({ ...npc, y: nextY }, obs))) npc.y = nextY;
                }

                // Empuje entre NPCs
                for (const otro of npcs) {
                    if (otro !== npc && isColliding(npc, otro)) {
                        const empuje = 0.5;
                        const dirX = npc.x - otro.x;
                        const dirY = npc.y - otro.y;
                        const dist = Math.hypot(dirX, dirY);

                        if (dist > 0) {
                            npc.x += (dirX / dist) * empuje;
                            npc.y += (dirY / dist) * empuje;
                        }
                    }
                }
            } else {
                npc.estado = "idle";

               
                if (npc.comportamiento === "patrulla") {
                    npc.direccion = npc.direccion || { x: 1, y: 0 };
                    npc.tiempoDireccion = npc.tiempoDireccion || 0;

                    npc.tiempoDireccion--;

                    if (npc.tiempoDireccion <= 0) {
                        const direcciones = [
                            { x: 1.25, y: 0 },
                            { x: -1.25, y: 0 },
                            { x: 0, y: 1.25 },
                            { x: 0, y: -1.25 }
                        ];
                        npc.direccion = direcciones[Math.floor(Math.random() * direcciones.length)];
                        npc.tiempoDireccion = 60 + Math.floor(Math.random() * 60); // 1–2 segundos
                    }

                    const nextX = npc.x + npc.direccion.x * npc.velocidad;
                    const nextY = npc.y + npc.direccion.y * npc.velocidad;

                    const colX = mapeo.obstacles.some(obs => isColliding({ ...npc, x: nextX }, obs));
                    const colY = mapeo.obstacles.some(obs => isColliding({ ...npc, y: nextY }, obs));

                    if (!colX) npc.x = nextX;
                    else npc.tiempoDireccion = 0;

                    if (!colY) npc.y = nextY;
                    else npc.tiempoDireccion = 0;
                }

            
                const distSpawn = Math.hypot(npc.x - npc.spawnX, npc.y - npc.spawnY);
                if (distSpawn > 10) { // umbral de distancia para considerar "lejos"
                    const dirX = (npc.spawnX - npc.x) / distSpawn;
                    const dirY = (npc.spawnY - npc.y) / distSpawn;

                    const nextX = npc.x + dirX * npc.velocidad;
                    const nextY = npc.y + dirY * npc.velocidad;

                    if (!mapeo.obstacles.some(obs => isColliding({ ...npc, x: nextX }, obs))) npc.x = nextX;
                    if (!mapeo.obstacles.some(obs => isColliding({ ...npc, y: nextY }, obs))) npc.y = nextY;
                }

            }
        }

        
        if (npc.vida <= 0) {
            if (!npc.experienciaOtorgadaYa) {
                player.experiencia += npc.experienciaOtorgada || 0;
                npc.experienciaOtorgadaYa = true; // para no duplicar
            }

            if (npc.muertoDesde === null) {
                npc.muertoDesde = Date.now(); // iniciar reloj
            } else {
                const tiempoMuerto = Date.now() - npc.muertoDesde;
                const distJugador = Math.hypot(player.x - npc.x, player.y - npc.y);

                if (tiempoMuerto >= npc.respawnTime && distJugador > npc.rangoVision) {
                    npc.x = npc.spawnX;
                    npc.y = npc.spawnY;
                    npc.vida = npc.vidaMax;
                    npc.estado = "idle";
                    npc.muertoDesde = null;
                }
            }
        }
    }
}


function drawNPCs(ctx, camera) {

    ctx.font = "12px monospace";
    ctx.textAlign = "center";

    for (const npc of npcs) {
        const tileX = Math.floor(npc.x / mapeo.tileSize);
        const tileY = Math.floor(npc.y / mapeo.tileSize);
        const tile = mapeo.map[tileY]?.[tileX];
        if (tile?.solid) {
            // Buscar un tile libre cercano
            for (let y = tileY - 1; y <= tileY + 1; y++) {
                for (let x = tileX - 1; x <= tileX + 1; x++) {
                    const t = mapeo.map[y]?.[x];
                    if (t && !t.solid) {
                        npc.x = x * mapeo.tileSize;
                        npc.y = y * mapeo.tileSize;
                        break;
                    }
                }
            }
        }
        const x = npc.x - camera.x;
        const y = npc.y - camera.y;

        // Nombre
        ctx.fillStyle = "white";
        ctx.fillText(npc.name, x + npc.w / 2, y - 8);

        // Sprite
        if (npc.image instanceof Image && npc.image.complete) {
            ctx.drawImage(npc.image, x, y, npc.w, npc.h);
        } else {
            ctx.fillStyle = npc.color || "gray";
            ctx.fillRect(x, y, npc.w, npc.h);
        }


        // Si es el objetivo del jugador, dibujar borde
        if (npc === player.objetivo) {
            ctx.strokeStyle = "yellow";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, npc.w, npc.h);
        }


        // Barra de vida
        if (npc.vida !== undefined) {
            const maxBarWidth = npc.w;
            const barHeight = 4;
            const vidaRatio = Math.max(npc.vida / npc.vidaMax, 0);

            ctx.fillStyle = "red";
            ctx.fillRect(x, y - 6, maxBarWidth, barHeight);

            ctx.fillStyle = "lime";
            ctx.fillRect(x, y - 6, maxBarWidth * vidaRatio, barHeight);
        }
    }
}
