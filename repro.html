<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Personalizado con Archivos Locales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #player-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #progress-bar {
            width: 80%;
            margin: 10px auto;
        }
        input[type="range"] {
            width: 100%;
        }
        #playlist {
            margin: 20px auto;
            list-style: none;
            padding: 0;
            max-height: 200px; /* Limita el tamaño de la lista */
            overflow-y: auto; /* Añade scroll vertical */
            border: 1px solid #ccc; /* Estilo para la lista */
            padding: 10px;
        }
        .audio-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Reproductor de Audio Personalizado</h1>

    <!-- Input para cargar archivos -->
    <input type="file" id="fileInput" accept="audio/*" multiple>
    <button onclick="addFiles()">Agregar Archivos</button>

    <!-- Audio -->
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <!-- Botones de control -->
    <div id="player-controls">
        <button onclick="prevAudio()">Anterior</button>
        <button onclick="togglePlay()">Play/Pausa</button>
        <button onclick="nextAudio()">Siguiente</button>
        <button onclick="playRandom()">Aleatorio</button>
    </div>

    <!-- Barra de progreso -->
    <div id="progress-bar">
        <input type="range" id="progress" value="0" step="1" onchange="seekAudio()">
    </div>

    <!-- Lista de reproducción -->
    <ul id="playlist"></ul>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progress');
        const playlistElement = document.getElementById('playlist');
        const fileInput = document.getElementById('fileInput');

        // Lista de reproducción (array de archivos locales)
        const playlist = [];
        let currentIndex = 0;

        // Actualizar lista de reproducción visual
        function updatePlaylist() {
            playlistElement.innerHTML = "";
            playlist.forEach((file, index) => {
                const li = document.createElement("li");
                li.className = "audio-item";
                li.textContent = file.name;

                // Botón para reproducir
                const playButton = document.createElement("button");
                playButton.textContent = "▶";
                playButton.onclick = () => playAudio(index);

                // Botón para eliminar
                const deleteButton = document.createElement("button");
                deleteButton.textContent = "❌";
                deleteButton.onclick = () => deleteAudio(index);

                // Añadir botones al elemento de la lista
                li.appendChild(playButton);
                li.appendChild(deleteButton);
                playlistElement.appendChild(li);
            });
        }

        // Cargar audio actual y reproducir
        function loadAudio(index) {
            currentIndex = index;
            audioPlayer.src = URL.createObjectURL(playlist[currentIndex]);
            audioPlayer.play();
        }

        function playAudio(index) {
            loadAudio(index);
        }

        // Función para reproducir/pausar
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        // Función para ir al siguiente audio
        function nextAudio() {
            currentIndex = (currentIndex + 1) % playlist.length; // Avanzar en la lista
            loadAudio(currentIndex); // Cargar y reproducir el siguiente audio
        }

        // Función para ir al audio anterior
        function prevAudio() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length; // Retroceder en la lista
            loadAudio(currentIndex); // Cargar y reproducir el audio anterior
        }

        // Función para reproducir aleatoriamente
        function playRandom() {
            currentIndex = Math.floor(Math.random() * playlist.length);
            loadAudio(currentIndex);
        }

        // Escuchar cuando termine una canción para pasar automáticamente a la siguiente
        audioPlayer.addEventListener('ended', () => {
            nextAudio(); // Avanzar automáticamente al siguiente
        });

        // Función para agregar archivos locales a la lista
        function addFiles() {
            const files = Array.from(fileInput.files);
            if (files.length > 0) {
                files.forEach(file => {
                    if (file.type.startsWith("audio/")) {
                        playlist.push(file);
                    } else {
                        alert(`El archivo "${file.name}" no es un audio válido.`);
                    }
                });
                updatePlaylist();
                fileInput.value = ""; // Limpiar input después de agregar
            } else {
                alert("Por favor selecciona al menos un archivo de audio.");
            }
        }

        // Función para eliminar una canción de la lista
        function deleteAudio(index) {
            playlist.splice(index, 1); // Eliminar del array
            updatePlaylist(); // Actualizar visualmente
        }

        // Función para actualizar la barra de progreso
        audioPlayer.addEventListener('timeupdate', () => {
            progressBar.max = audioPlayer.duration || 0;
            progressBar.value = audioPlayer.currentTime || 0;
        });

        // Función para buscar en la barra de progreso
        function seekAudio() {
            audioPlayer.currentTime = progressBar.value;
        }
    </script>
</body>
</html>
