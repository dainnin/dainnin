    <!-- Estilos -->
    <style>
        .article-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .article {
            position: fixed;
            width: 100%;
            height: auto;
            transition: transform 0.5s ease-in-out;
            transform: translateX(100vw);
            z-index: 99999;
            background: white;
            padding: 20px;
           
        }

        .visible {
            transform: translateX(0);
        }

        main {
            width: 100%;
        }

        /* Botón flotante */
        .btn-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            z-index: 99999;
        }

        .btn-toggle:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <header name="_header"></header>

    <!-- Botón para alternar la visibilidad del artículo -->
    <button class="btn-toggle" onclick="toggleContenido()">Ver Información</button>

    <!-- Artículo separado, antes del main -->
    <div class="article-container">
        <article class="article" id="content">

    <!-- Espacio para anuncios -->
    <ins class="adsbygoogle" style="display:block" data-ad-format="autorelaxed" data-ad-client="ca-pub-3946532391760902" data-ad-slot="8266906167"></ins>

    <footer name="_footer"></footer>

    <script>
        function toggleContenido() {
            const article = document.getElementById("content");
            const button = document.querySelector(".btn-toggle");

            if (article.classList.contains("visible")) {
                article.classList.remove("visible");
                button.innerText = "Ver Información";
            } else {
                article.classList.add("visible");
                button.innerText = "Ocultar Información";
            }
        }
    </script>
</body>
